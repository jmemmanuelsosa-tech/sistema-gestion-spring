# Nombre del proyecto
spring.application.name=nexus-erp

# Puerto del servidor (puedes entrar en http://localhost:8080)
server.port=8080

# Conexion a MySQL (Base de datos creada en Workbench)
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_gestion_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Evita advertencias si aun no hemos creado archivos HTML en la carpeta templates
spring.thymeleaf.check-template-location=false

# Mostrar detalles claros cuando ocurra un error
server.error.include-message=always