<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Producto - NEXUS GESTIÓN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{navegation/navegacion :: menuSuperior('productos', 'Productos > Formulario')}"></div>

    <div class="container px-4 py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="erp-card shadow-sm">
                    <div class="erp-card-header bg-light">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i>Datos del Producto</h5>
                    </div>
                    <div class="p-4">
                        <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label fw-bold small">Nombre del Producto <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{nombre}" class="form-control" required autofocus>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Categoría <span class="text-danger">*</span></label>
                                    <select th:field="*{categoria}" class="form-select" required>
                                        <option value="" disabled selected>Seleccione...</option>
                                        <option value="Bebidas">Bebidas</option>
                                        <option value="Almacén">Almacén</option>
                                        <option value="Limpieza">Limpieza</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Precio de Venta ($) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" th:field="*{precio}" class="form-control fw-bold" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold small">Descripción (Opcional)</label>
                                <textarea th:field="*{descripcion}" class="form-control" rows="2"></textarea>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/productos}" class="btn btn-outline-secondary px-4 fw-bold">Cancelar</a>
                                <button type="submit" class="btn btn-primary px-4 fw-bold"><i class="bi bi-floppy me-2"></i>Guardar Producto</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
