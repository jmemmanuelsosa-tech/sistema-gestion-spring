<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos - NEXUS GESTIÓN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{navegation/navegacion :: menuSuperior('productos', 'Productos > Catálogo')}"></div>

    <div class="container px-4 py-4">
        
        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show py-2 shadow-sm"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensajeExito}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-0"><i class="bi bi-box-seam text-warning me-2"></i>Catálogo de Productos</h3>
            </div>
            <div class="d-flex gap-2">
                <select id="filtroCategoria" class="form-select bg-light shadow-sm" style="width: 200px;">
                    <option value="">Todas las categorías</option>
                    <option value="Bebidas">Bebidas</option>
                    <option value="Almacén">Almacén</option>
                    <option value="Limpieza">Limpieza</option>
                </select>
                <div class="input-group shadow-sm" style="width: 250px;">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="buscadorProductos" class="form-control border-start-0" placeholder="Buscar producto...">
                </div>
                <a th:href="@{/productos/nuevo}" class="btn btn-primary fw-bold shadow-sm"><i class="bi bi-plus-lg me-1"></i> Nuevo Producto</a>
            </div>
        </div>

        <div class="erp-card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">Nombre del Producto</th>
                            <th>Categoría</th>
                            <th>Descripción</th>
                            <th class="text-end pe-4">Precio</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos">
                        <tr th:if="${#lists.isEmpty(listaProductos)}">
                            <td colspan="4" class="text-center py-5 text-muted">No hay productos registrados.</td>
                        </tr>
                        <tr th:each="p : ${listaProductos}">
                            <!-- El nombre es un enlace directo a la edición -->
                            <td class="ps-3">
                                <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="fw-bold text-decoration-none text-primary" th:text="${p.nombre}"></a>
                            </td>
                            <td class="categoria-celda" th:text="${p.categoria}"></td>
                            <td th:text="${p.descripcion}"></td>
                            <td class="text-end pe-4 fw-bold font-monospace text-dark">$ <span th:text="${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Script para filtrar simultáneamente por texto y por categoría desplegable
        const buscador = document.getElementById('buscadorProductos');
        const filtroCat = document.getElementById('filtroCategoria');
        const filas = document.querySelectorAll('#tablaProductos tr');

        function filtrarTabla() {
            let textoBusqueda = buscador.value.toLowerCase();
            let catSeleccionada = filtroCat.value.toLowerCase();

            filas.forEach(fila => {
                // Evitar filtrar la fila de "No hay productos"
                if(fila.cells.length === 1) return; 

                let textoFila = fila.textContent.toLowerCase();
                let categoriaFila = fila.querySelector('.categoria-celda').textContent.toLowerCase();

                let coincideTexto = textoFila.includes(textoBusqueda);
                let coincideCat = (catSeleccionada === "" || categoriaFila === catSeleccionada);

                fila.style.display = (coincideTexto && coincideCat) ? '' : 'none';
            });
        }

        buscador.addEventListener('keyup', filtrarTabla);
        filtroCat.addEventListener('change', filtrarTabla);
    </script>
</body>
</html>
