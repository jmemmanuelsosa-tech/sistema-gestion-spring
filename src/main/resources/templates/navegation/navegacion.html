<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Fragmento principal de navegación -->
    <div th:fragment="menuSuperior(moduloActivo, rutaActual)">

        <!-- CABECERA: Logo y Usuario -->
        <header class="erp-top-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-layers-half fs-4 text-primary"></i>
                <div>
                    <a th:href="@{/inicio}" class="erp-brand-title">NEXUS GESTIÓN</a>
                    <span class="badge bg-light text-secondary border ms-2">ERP v1.0</span>
                </div>
            </div>

            <!-- Menú de Usuario -->
            <div class="d-flex align-items-center gap-3">
                <div class="text-end d-none d-sm-block">
                    <div class="fw-bold small text-uppercase text-dark">PANEL DE ADMINISTRACIÓN</div>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-light border dropdown-toggle py-0 px-2" type="button" data-bs-toggle="dropdown">
                            <span th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.rol : 'Administrador'}"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                            <li>
                                <span class="dropdown-item-text small text-muted">
                                    Usuario: <strong th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.username : 'admin'}"></strong>
                                </span>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <a class="dropdown-item text-danger small fw-semibold" th:href="@{/logout}">
                                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
                <i class="bi bi-person-circle fs-2 text-secondary"></i>
            </div>
        </header>

        <!-- MÓDULOS PRINCIPALES -->
        <nav class="navbar navbar-expand-lg erp-navbar">
            <div class="container-fluid px-0">
                <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuErp">
                    <i class="bi bi-list fs-4"></i>
                </button>
                
                <div class="collapse navbar-collapse" id="menuErp">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${moduloActivo == 'clientes' ? 'active' : ''}" th:href="@{/clientes}">
                                <i class="bi bi-people-fill me-1"></i> Clientes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${moduloActivo == 'productos' ? 'active' : ''}" href="#" onclick="alert('Módulo de Productos en construcción'); return false;">
                                <i class="bi bi-box-seam me-1"></i> Productos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${moduloActivo == 'ventas' ? 'active' : ''}" href="#" onclick="alert('Módulo de Ventas en construcción'); return false;">
                                <i class="bi bi-cart-check me-1"></i> Ventas
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${moduloActivo == 'cobranzas' ? 'active' : ''}" href="#" onclick="alert('Módulo de Cobranzas en construcción'); return false;">
                                <i class="bi bi-cash-coin me-1"></i> Cobranzas
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:classappend="${moduloActivo == 'reportes' ? 'active' : ''}" href="#" onclick="alert('Dashboard de Reportes en construcción'); return false;">
                                <i class="bi bi-bar-chart-fill me-1"></i> Reportes
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- BREADCRUMBS (Migas de pan interactivas para navegación) -->
        <div class="erp-breadcrumb-bar d-flex align-items-center text-muted border-bottom py-2 px-3 bg-white">
            <i class="bi bi-house-door-fill text-primary me-2"></i>
            <a th:href="@{/inicio}" class="text-decoration-none fw-semibold text-primary">Inicio</a>
            <i class="bi bi-chevron-right mx-2 small"></i>
            <span th:text="${rutaActual}">Ruta</span>
        </div>

    </div>

</body>
</html>
