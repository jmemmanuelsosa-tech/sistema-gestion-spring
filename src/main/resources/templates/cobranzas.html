<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Cobranzas - NEXUS GESTIÓN</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%230d6efd'><path d='M8.235 1.559a.5.5 0 0 0-.47 0l-7.5 4a.5.5 0 0 0 0 .882L3.188 8 .264 9.559a.5.5 0 0 0 0 .882l7.5 4a.5.5 0 0 0 .47 0l7.5-4a.5.5 0 0 0 0-.882L12.813 8l2.922-1.559a.5.5 0 0 0 0-.882l-7.5-4zM8 9.433 1.562 6 8 2.567 14.438 6 8 9.433z'/></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{navegation/navegacion :: menuSuperior('cobranzas', 'Cobranzas > Selección de Cliente')}"></div>

    <div class="container px-4 py-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-0"><i class="bi bi-cash-coin text-success me-2"></i>Módulo de Cobranzas</h3>
                <p class="text-muted small">Seleccione un cliente para registrar pagos o deudas a cuenta corriente.</p>
            </div>
            
            <div class="input-group w-25 shadow-sm">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control border-start-0" placeholder="Buscar cliente...">
            </div>
        </div>

        <div class="erp-card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3 py-3">Apellido y Nombre</th>
                            <th>DNI / CUIT</th>
                            <th>Teléfono</th>
                            <th class="text-end pe-4">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(listaClientes)}">
                            <td colspan="4" class="text-center py-5 text-muted">
                                No hay clientes registrados en el sistema. Vaya al módulo "Clientes" para agregar uno.
                            </td>
                        </tr>

                        <!-- Lista todos los clientes -->
                        <tr th:each="c : ${listaClientes}">
                            <td class="fw-bold ps-3 text-dark" th:text="${c.apellido} + ', ' + ${c.nombre}"></td>
                            
                            <td>
                                <span th:if="${c.dni != null}" class="badge bg-light text-dark border" th:text="${c.dni}"></span>
                                <span th:if="${c.dni == null}" class="text-muted">-</span>
                            </td>
                            <td th:text="${c.telefono != null && !c.telefono.isEmpty() ? c.telefono : '-'}"></td>
                            
                            <td class="text-end pe-3">
                                <!-- BOTÓN PARA ENTRAR A LA CUENTA CORRIENTE DE ESTE CLIENTE -->
                                <a th:href="@{/cuenta-corriente/{id}(id=${c.id})}" class="btn btn-success fw-bold px-3 shadow-sm">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Abrir Cuenta
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
