<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio - NEXUS GESTIÓN</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%230d6efd'><path d='M8.235 1.559a.5.5 0 0 0-.47 0l-7.5 4a.5.5 0 0 0 0 .882L3.188 8 .264 9.559a.5.5 0 0 0 0 .882l7.5 4a.5.5 0 0 0 .47 0l7.5-4a.5.5 0 0 0 0-.882L12.813 8l2.922-1.559a.5.5 0 0 0 0-.882l-7.5-4zM8 9.433 1.562 6 8 2.567 14.438 6 8 9.433z'/></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

    <!-- Menú Superior -->
    <div th:replace="~{navegation/navegacion :: menuSuperior('inicio', 'Panel Principal')}"></div>

    <div class="container-fluid px-4 py-5 text-center">
        <h1 class="display-6 fw-bold text-dark mt-4">Bienvenido a NEXUS GESTIÓN</h1>
        <p class="text-muted fs-5">Tu sistema integral de control comercial y cobranzas.</p>
        
        <div class="row justify-content-center mt-5 gap-3">
            
            <!-- Acceso a Clientes -->
            <div class="col-12 col-md-3">
                <a th:href="@{/clientes}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 py-4 erp-card hover-scale transition-all">
                        <i class="bi bi-people text-primary" style="font-size: 3rem;"></i>
                        <h5 class="text-dark mt-3 fw-bold">Gestionar Clientes</h5>
                    </div>
                </a>
            </div>
            
            <!-- Acceso a Ventas -->
            <div class="col-12 col-md-3">
                <a th:href="@{/ventas}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 py-4 erp-card hover-scale transition-all">
                        <i class="bi bi-cart-check text-primary" style="font-size: 3rem;"></i>
                        <h5 class="text-dark mt-3 fw-bold">Módulo Ventas</h5>
                    </div>
                </a>
            </div>
            
            <!-- Acceso a Productos -->
            <div class="col-12 col-md-3">
                <a th:href="@{/productos}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 py-4 erp-card hover-scale transition-all">
                        <i class="bi bi-box-seam text-warning" style="font-size: 3rem;"></i>
                        <h5 class="text-dark mt-3 fw-bold">Módulo Productos</h5>
                    </div>
                </a>
            </div>
            
            <!-- Acceso a Cobranzas -->
            <div class="col-12 col-md-3">
                <a th:href="@{/cobranzas}" class="text-decoration-none">
                    <div class="card shadow-sm border-0 py-4 erp-card hover-scale transition-all">
                        <i class="bi bi-cash-coin text-success" style="font-size: 3rem;"></i>
                        <h5 class="text-dark mt-3 fw-bold">Módulo Cobranzas</h5>
                    </div>
                </a>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
