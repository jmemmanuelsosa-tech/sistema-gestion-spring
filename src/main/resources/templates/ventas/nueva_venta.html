<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Punto de Venta - NEXUS GESTIÓN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{navegation/navegacion :: menuSuperior('ventas', 'Ventas > Punto de Venta (POS)')}"></div>

    <div class="container-fluid px-4 py-4">
        <div class="row g-3">
            
            <!-- PANEL IZQUIERDO: FORMULARIO DE CARGA -->
            <div class="col-lg-5">
                <div class="erp-card shadow-sm h-100">
                    <div class="erp-card-header bg-light"><i class="bi bi-cart-plus me-2"></i>Nueva Venta</div>
                    <div class="p-3">
                        
                        <!-- Cabecera Venta -->
                        <div class="row mb-3 g-2">
                            <div class="col-md-7">
                                <label class="form-label small fw-bold">Cliente</label>
                                <select id="clienteId" class="form-select bg-light">
                                    <option value="">Consumidor Final (Sin nombre)</option>
                                    <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.apellido + ', ' + c.nombre}"></option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small fw-bold">Método Pago</label>
                                <select id="metodoPago" class="form-select fw-bold border-secondary">
                                    <option value="EFECTIVO">EFECTIVO</option>
                                    <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                                    <option value="TARJETA">TARJETA</option>
                                    <option value="CUENTA_CORRIENTE" class="text-danger">CUENTA CORRIENTE (Fiado)</option>
                                </select>
                            </div>
                        </div>

                        <hr>

                        <!-- Buscador de Productos -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Buscar Producto</label>
                            <select id="productoSelect" class="form-select border-primary" style="border-width: 2px;">
                                <option value="" disabled selected>Seleccione un producto...</option>
                                <option th:each="p : ${productos}" 
                                        th:value="${p.id}" 
                                        th:data-nombre="${p.nombre}"
                                        th:data-precio="${p.precio}"
                                        th:text="${p.nombre + ' - $' + #numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')}">
                                </option>
                            </select>
                        </div>
                        
                        <div class="row mb-3 g-2">
                            <div class="col-6">
                                <label class="form-label small fw-bold">Cantidad</label>
                                <input type="number" id="cantidadInput" class="form-control fw-bold text-center" value="1" min="1">
                            </div>
                            <div class="col-6 d-flex align-items-end">
                                <button type="button" onclick="agregarAlCarrito()" class="btn btn-outline-primary w-100 fw-bold">
                                    <i class="bi bi-plus-lg"></i> Agregar
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- PANEL DERECHO: TICKET Y COBRO -->
            <div class="col-lg-7">
                <div class="erp-card shadow-sm d-flex flex-column h-100">
                    <div class="erp-card-header bg-dark text-white"><i class="bi bi-receipt me-2"></i>Detalle del Ticket</div>
                    
                    <div class="p-0 flex-grow-1" style="max-height: 400px; overflow-y: auto;">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th class="ps-3">Cant.</th>
                                    <th>Producto</th>
                                    <th class="text-end">P. Unitario</th>
                                    <th class="text-end pe-3">Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="tablaCarrito">
                                <tr id="filaVacia"><td colspan="5" class="text-center py-5 text-muted">El carrito está vacío</td></tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Totales y Botón Confirmar -->
                    <div class="bg-light p-3 border-top mt-auto">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="text-muted fw-bold mb-0">TOTAL A COBRAR:</h4>
                            <h1 class="text-success fw-bold mb-0 font-monospace">$ <span id="totalVenta">0</span></h1>
                        </div>
                        <button type="button" class="btn btn-success btn-lg w-100 fw-bold py-3" onclick="confirmarVenta(event)">
                            <i class="bi bi-check2-circle me-2"></i> CONFIRMAR VENTA
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE ÉXITO-->
    <div class="modal fade" id="modalVentaExito" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-body text-center p-5">
                    <i class="bi bi-check-circle-fill text-success mb-3" style="font-size: 4rem;"></i>
                    <h3 class="fw-bold text-dark">¡Venta Registrada!</h3>
                    <p class="text-muted">El ticket y los saldos se han actualizado correctamente.</p>
                    
                    <div class="d-flex flex-column gap-2 mt-4">
                        <a th:href="@{/ventas}" class="btn btn-primary fw-bold py-2">
                            Ir al Historial (Imprimir Ticket)
                        </a>
                        <a th:href="@{/ventas/nueva}" class="btn btn-outline-success fw-bold py-2">
                            Registrar Nueva Venta
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE ERROR -->
    <div class="modal fade" id="modalVentaError" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-body text-center p-5">
                    <i class="bi bi-x-circle-fill text-danger mb-3" style="font-size: 4rem;"></i>
                    <h3 class="fw-bold text-dark">Error en la Venta</h3>
                    <p class="text-muted" id="textoErrorVenta">Ha ocurrido un problema.</p>
                    <button type="button" class="btn btn-outline-danger fw-bold px-4 mt-3" data-bs-dismiss="modal">Revisar e Intentar de Nuevo</button>
                </div>
            </div>
        </div>
    </div>
    
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script de lógica de carrito en JS -->
    <script>
        // Función para mostrar errores de forma segura
        function mostrarErrorModal(mensaje) {
            let mensajeLimpio = mensaje.replace("Error al registrar venta: ", "");
            
            try {
                document.getElementById('textoErrorVenta').textContent = mensajeLimpio;
                let modalElement = document.getElementById('modalVentaError');
                let modalInstance = bootstrap.Modal.getInstance(modalElement) || new bootstrap.Modal(modalElement);
                modalInstance.show();
            } catch (error) {
                // Si Bootstrap falla (porque no cargó su librería), sale el cartel clásico que SIEMPRE funciona
                alert("AVISO DEL SISTEMA:\n\n" + mensajeLimpio);
                console.error("Fallo al abrir modal de Bootstrap:", error);
            }
        }
        
        let carrito = []; 
        
        function agregarAlCarrito() {
            const select = document.getElementById('productoSelect');
            const cantidadInput = document.getElementById('cantidadInput');
            
            if (!select.value) { mostrarErrorModal("Seleccione un producto."); return; }
            if (cantidadInput.value <= 0) { mostrarErrorModal("La cantidad debe ser mayor a 0."); return; }

            const id = select.value;
            const option = select.options[select.selectedIndex];
            const nombre = option.getAttribute('data-nombre');
            const precio = parseFloat(option.getAttribute('data-precio'));
            const cantidad = parseInt(cantidadInput.value);

            const index = carrito.findIndex(item => item.productoId === id);
            if (index !== -1) {
                carrito[index].cantidad += cantidad;
            } else {
                carrito.push({ productoId: id, nombre: nombre, precio: precio, cantidad: cantidad });
            }

            select.value = "";
            cantidadInput.value = 1;
            renderizarCarrito();
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const tbody = document.getElementById('tablaCarrito');
            const totalSpan = document.getElementById('totalVenta');
            
            tbody.innerHTML = "";
            let total = 0.0;

            if (carrito.length === 0) {
                tbody.innerHTML = '<tr id="filaVacia"><td colspan="5" class="text-center py-5 text-muted">El carrito está vacío</td></tr>';
                totalSpan.textContent = "0";
                return;
            }

            carrito.forEach((item, index) => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="ps-3 fw-bold">${item.cantidad}</td>
                    <td>${item.nombre}</td>
                    <td class="text-end text-muted">$ ${item.precio.toLocaleString('es-AR')}</td>
                    <td class="text-end pe-3 fw-bold text-dark">$ ${subtotal.toLocaleString('es-AR')}</td>
                    <td class="text-center"><button class="btn btn-sm btn-outline-danger border-0" onclick="eliminarDelCarrito(${index})"><i class="bi bi-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            });

            totalSpan.textContent = total.toLocaleString('es-AR');
        }

        function confirmarVenta(event) {
            if (event) event.preventDefault(); // Corta cualquier recarga de pantalla

            if (carrito.length === 0) { 
                mostrarErrorModal("El carrito está vacío."); 
                return; 
            }

            const clienteId = document.getElementById('clienteId').value;
            const metodoPago = document.getElementById('metodoPago').value;

            // Validación extra para fiado
            if (metodoPago === 'CUENTA_CORRIENTE' && !clienteId) {
                mostrarErrorModal("Para enviar a Cuenta Corriente debe seleccionar un Cliente.");
                return;
            }

            const payload = {
                clienteId: clienteId ? parseInt(clienteId) : null,
                metodoPago: metodoPago,
                items: carrito.map(item => ({ 
                    productoId: parseInt(item.productoId), 
                    cantidad: parseInt(item.cantidad) 
                }))
            };

            const csrfToken = document.querySelector('meta[name="_csrf"]').content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

            fetch('/ventas/api/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify(payload)
            })
            .then(async response => {
                if (response.ok) {
                    window.location.replace('/ventas');
                } else {
                    const errorText = await response.text();
                    mostrarErrorModal(errorText); // Muestra el cartel con el error
                }
            })
            .catch(error => {
                mostrarErrorModal("Error de conexión con el servidor.");
            });
        }
    </script>
</body>
</html>
