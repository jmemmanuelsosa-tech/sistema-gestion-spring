<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas - NEXUS GESTIÓN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{navegation/navegacion :: menuSuperior('ventas', 'Ventas > Cierres y Reportes')}"></div>

    <div class="container px-4 py-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark mb-0"><i class="bi bi-cart-check text-primary me-2"></i>Dashboard de Ventas</h3>
                <p class="text-muted small">Análisis de facturación y movimientos.</p>
            </div>
            <div>
                <!-- Botón simulado para la fase 2 -->
                <button class="btn btn-primary fw-bold shadow-sm" onclick="alert('Próximamente: Pantalla de Punto de Venta (POS)')">
                    <i class="bi bi-cart-plus me-1"></i> Nueva Venta
                </button>
            </div>
        </div>

        <div class="row mb-4">
            <!-- TARJETA DE RECAUDACIÓN DINÁMICA -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm bg-white erp-card">
                    <div class="card-body">
                        <span class="d-block text-muted small fw-bold mb-1 text-uppercase">
                            Recaudación <span th:text="${filtroActual}"></span>
                        </span>
                        <h2 class="mb-0 fw-bold text-success font-monospace">
                            $ <span th:text="${#numbers.formatDecimal(totalRecaudado, 1, 'POINT', 0, 'COMMA')}">0</span>
                        </h2>
                    </div>
                </div>
            </div>

            <!-- FILTROS DE TIEMPO -->
            <div class="col-md-8">
                <div class="card border-0 shadow-sm bg-white erp-card h-100">
                    <div class="card-body d-flex align-items-center justify-content-end gap-2">
                        <span class="text-muted small fw-bold me-3"><i class="bi bi-calendar3 me-1"></i> FILTRAR POR:</span>
                        
                        <a th:href="@{/ventas(filtro='hoy')}" class="btn btn-sm fw-bold px-3" 
                           th:classappend="${filtroActual == 'hoy' ? 'btn-primary' : 'btn-outline-secondary'}">Hoy</a>
                           
                        <a th:href="@{/ventas(filtro='semana')}" class="btn btn-sm fw-bold px-3" 
                           th:classappend="${filtroActual == 'semana' ? 'btn-primary' : 'btn-outline-secondary'}">Esta Semana</a>
                           
                        <a th:href="@{/ventas(filtro='mes')}" class="btn btn-sm fw-bold px-3" 
                           th:classappend="${filtroActual == 'mes' ? 'btn-primary' : 'btn-outline-secondary'}">Este Mes</a>
                           
                        <a th:href="@{/ventas(filtro='ano')}" class="btn btn-sm fw-bold px-3" 
                           th:classappend="${filtroActual == 'ano' ? 'btn-primary' : 'btn-outline-secondary'}">Este Año</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA DE TICKETS -->
        <div class="erp-card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">Nº Ticket</th>
                            <th>Fecha y Hora</th>
                            <th>Cliente</th>
                            <th>Método de Pago</th>
                            <th class="text-end pe-4">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(ventas)}">
                            <td colspan="5" class="text-center py-5 text-muted">
                                <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                                No hay ventas registradas en este período.
                            </td>
                        </tr>
                        <tr th:each="v : ${ventas}">
                            <td class="ps-3 text-muted fw-bold">#<span th:text="${v.id}"></span></td>
                            <td th:text="${#temporals.format(v.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${v.cliente != null ? v.cliente.apellido + ', ' + v.cliente.nombre : 'Consumidor Final'}"></td>
                            <td>
                                <span class="badge bg-light border text-dark" th:text="${v.metodoPago}"></span>
                            </td>
                            <td class="text-end pe-4 fw-bold font-monospace text-dark">
                                $ <span th:text="${#numbers.formatDecimal(v.total, 1, 'POINT', 0, 'COMMA')}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
